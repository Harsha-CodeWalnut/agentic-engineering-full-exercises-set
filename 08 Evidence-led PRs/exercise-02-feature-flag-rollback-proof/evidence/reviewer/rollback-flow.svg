<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-labelledby="title">
  <title id="title">Atomic invoice-preview rollback without a deployment</title>
  <rect width="980" height="280" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="13">
    <text x="490" y="32" text-anchor="middle" font-size="18" fill="#0f172a">Kill switch - no code deploy</text>
    <rect x="16" y="60" width="170" height="80" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="101" y="92" text-anchor="middle" fill="#0f172a">Validate CLI</text>
    <text x="101" y="114" text-anchor="middle" fill="#475569">actor, reason, ISO time</text>
    <line x1="186" y1="100" x2="216" y2="100" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="216" y="60" width="150" height="80" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="291" y="92" text-anchor="middle" fill="#991b1b">Invalid?</text>
    <text x="291" y="114" text-anchor="middle" fill="#475569">exit != 0, no write</text>
    <line x1="366" y1="100" x2="396" y2="100" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="396" y="60" width="170" height="80" rx="8" fill="#fff7ed" stroke="#f97316"/>
    <text x="481" y="92" text-anchor="middle" fill="#9a3412">Write temp file</text>
    <text x="481" y="114" text-anchor="middle" fill="#475569">enabled false</text>
    <line x1="566" y1="100" x2="596" y2="100" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="596" y="60" width="170" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="681" y="92" text-anchor="middle" fill="#1e3a8a">Atomic rename</text>
    <text x="681" y="114" text-anchor="middle" fill="#475569">empty allowlist</text>
    <line x1="766" y1="100" x2="796" y2="100" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="796" y="60" width="164" height="80" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="878" y="92" text-anchor="middle" fill="#065f46">Same account</text>
    <text x="878" y="114" text-anchor="middle" fill="#475569">legacy, 0 API</text>
    <text x="490" y="188" text-anchor="middle" fill="#334155">Revision rollback-2026-08-14T10-30-00-000Z, lastRollback recorded, 44.561 ms</text>
    <text x="490" y="220" text-anchor="middle" fill="#475569">Protected live config/invoice-preview.json is not edited. The drill uses a temporary copy.</text>
    <text x="490" y="252" text-anchor="middle" fill="#475569">Proof: evidence/rollback-drill.md and evidence/rollback-drill.json</text>
  </g>
</svg>
