<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="title">
  <title id="title">Naive flag repair versus kill-switch proof</title>
  <rect width="980" height="340" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <text x="490" y="36" text-anchor="middle" font-size="20" fill="#0f172a">What a reviewer would see</text>
    <rect x="24" y="56" width="452" height="260" rx="12" fill="#ffffff" stroke="#fca5a5"/>
    <text x="250" y="88" text-anchor="middle" font-size="16" fill="#991b1b">Before - product-request repair</text>
    <text x="48" y="124" font-size="14" fill="#334155">Default evaluation: true</text>
    <text x="48" y="152" font-size="14" fill="#dc2626">Disabled still loads preview</text>
    <text x="48" y="180" font-size="14" fill="#dc2626">Provider error still loads preview</text>
    <text x="48" y="208" font-size="14" fill="#dc2626">Invalid context accepted</text>
    <text x="48" y="236" font-size="14" fill="#dc2626">Rollback: in-place enabled false</text>
    <text x="48" y="264" font-size="13" fill="#64748b">Allowlist kept, no audit, no reject</text>
    <text x="48" y="288" font-size="13" fill="#64748b">All six rollout checks failed</text>
    <rect x="504" y="56" width="452" height="260" rx="12" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="730" y="88" text-anchor="middle" font-size="16" fill="#065f46">After - contract proof</text>
    <text x="528" y="124" font-size="14" fill="#334155">Default evaluation: false</text>
    <text x="528" y="152" font-size="14" fill="#16a34a">Disabled: legacy, 0 API, 0 events</text>
    <text x="528" y="180" font-size="14" fill="#16a34a">Provider error: legacy, 0 API</text>
    <text x="528" y="208" font-size="14" fill="#16a34a">Invalid context rejected first</text>
    <text x="528" y="236" font-size="14" fill="#16a34a">Rollback: validate, temp, rename</text>
    <text x="528" y="264" font-size="13" fill="#334155">Empty allowlist, lastRollback, 44.561 ms</text>
    <text x="528" y="288" font-size="13" fill="#334155">All six rollout checks passed</text>
  </g>
</svg>
