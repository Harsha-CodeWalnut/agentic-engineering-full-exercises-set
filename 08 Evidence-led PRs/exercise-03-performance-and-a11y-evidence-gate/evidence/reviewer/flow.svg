<svg xmlns="http://www.w3.org/2000/svg" width="980" height="240" viewBox="0 0 980 240" role="img" aria-labelledby="title">
  <title id="title">How a reviewer should read the quality gate</title>
  <rect width="980" height="240" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="20" y="70" width="160" height="70" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="100" y="100" text-anchor="middle" fill="#0f172a">Source SHA</text>
    <text x="100" y="120" text-anchor="middle" fill="#475569">0d82699</text>
    <line x1="180" y1="105" x2="220" y2="105" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="220" y="70" width="160" height="70" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="300" y="100" text-anchor="middle" fill="#0f172a">Production build</text>
    <text x="300" y="120" text-anchor="middle" fill="#475569">vite preview /</text>
    <line x1="380" y1="105" x2="420" y2="105" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="420" y="40" width="180" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="510" y="70" text-anchor="middle" fill="#1e3a8a">3 Lighthouse runs</text>
    <rect x="420" y="120" width="180" height="50" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="510" y="150" text-anchor="middle" fill="#065f46">1 axe Chrome scan</text>
    <line x1="600" y1="105" x2="640" y2="105" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="640" y="70" width="150" height="70" rx="8" fill="#fff7ed" stroke="#f97316"/>
    <text x="715" y="100" text-anchor="middle" fill="#9a3412">Worst-run gate</text>
    <text x="715" y="120" text-anchor="middle" fill="#475569">min score, max LCP</text>
    <line x1="790" y1="105" x2="830" y2="105" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="830" y="70" width="130" height="70" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="895" y="100" text-anchor="middle" fill="#065f46">PASSED</text>
    <text x="895" y="120" text-anchor="middle" fill="#475569">exit 0</text>
    <text x="490" y="210" text-anchor="middle" fill="#475569">One bad run or any axe violation writes failed and exits non-zero. Averages cannot hide a regression.</text>
  </g>
</svg>
