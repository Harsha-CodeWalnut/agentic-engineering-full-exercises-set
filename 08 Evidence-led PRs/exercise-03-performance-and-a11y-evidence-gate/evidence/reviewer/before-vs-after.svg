<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="title">
  <title id="title">Naive UI pass versus pessimistic quality gate</title>
  <rect width="980" height="340" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <text x="490" y="36" text-anchor="middle" font-size="20" fill="#0f172a">What a reviewer would see</text>
    <rect x="24" y="56" width="452" height="260" rx="12" fill="#ffffff" stroke="#fca5a5"/>
    <text x="250" y="88" text-anchor="middle" font-size="16" fill="#991b1b">Before - looks fine, fails the gate</text>
    <text x="48" y="124" font-size="14" fill="#dc2626">3.2s busy-loop before first paint</text>
    <text x="48" y="152" font-size="14" fill="#dc2626">Worst LCP 3380 ms (budget 2500)</text>
    <text x="48" y="180" font-size="14" fill="#dc2626">Icon button titled Download only</text>
    <text x="48" y="208" font-size="14" fill="#dc2626">axe button-name violation</text>
    <text x="48" y="244" font-size="13" fill="#64748b">A screenshot of the dashboard can still look correct</text>
    <text x="48" y="276" font-size="13" fill="#64748b">One lucky Lighthouse run could hide the delay</text>
    <rect x="504" y="56" width="452" height="260" rx="12" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="730" y="88" text-anchor="middle" font-size="16" fill="#065f46">After - pessimistic gate</text>
    <text x="528" y="124" font-size="14" fill="#16a34a">Busy-loop removed from main.tsx</text>
    <text x="528" y="152" font-size="14" fill="#16a34a">Worst LCP 1356 ms across 3 runs</text>
    <text x="528" y="180" font-size="14" fill="#16a34a">aria-label=Download evidence</text>
    <text x="528" y="208" font-size="14" fill="#16a34a">axe violations 0, a11y 1.00</text>
    <text x="528" y="244" font-size="13" fill="#334155">Worst run decides; averages cannot hide a miss</text>
    <text x="528" y="276" font-size="13" fill="#334155">Injected 0.89 / button-name still fail the gate</text>
  </g>
</svg>
